<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .disponible-true {
            color: green;
            font-weight: bold;
        }
        .disponible-false {
            color: red;
            font-weight: bold;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header text-white">
            <h3 class="mb-0">
                <i class="fas fa-book"></i> Catálogo de Libros
            </h3>
        </div>
        <div class="card-body">
            <!-- Barra de búsqueda -->
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body">
                            <h5><i class="fas fa-search"></i> Buscar Libros</h5>
                            <form th:action="@{/web/libros/buscar}" method="get" class="row g-3">
                                <div class="col-md-4">
                                    <input type="text" class="form-control" name="titulo" placeholder="Buscar por título">
                                </div>
                                <div class="col-md-4">
                                    <input type="text" class="form-control" name="autor" placeholder="Buscar por autor">
                                </div>
                                <div class="col-md-3">
                                    <input type="text" class="form-control" name="genero" placeholder="Buscar por género">
                                </div>
                                <div class="col-md-1">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="fas fa-search"></i>
                                    </button>
                                </div>
                            </form>
                            <div class="mt-2" th:if="${criterioBusqueda}">
                                <small class="text-muted">Resultados para: <strong th:text="${criterioBusqueda}"></strong></small>
                                <a th:href="@{/web/libros}" class="btn btn-sm btn-link">Limpiar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="mb-3">
                <a th:href="@{/web/libros/nuevo}" class="btn btn-success">
                    <i class="fas fa-plus"></i> Nuevo Libro
                </a>
                <a th:href="@{/web/libros}" class="btn btn-secondary">
                    <i class="fas fa-sync"></i> Refrescar
                </a>
            </div>

            <!-- Tabla de libros -->
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Género</th>
                        <th>Precio</th>
                        <th>Páginas</th>
                        <th>Disponibilidad</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="libro : ${libros}" th:object="${libro}">
                        <td th:text="*{id}"></td>
                        <td th:text="*{titulo}"></td>
                        <td th:text="*{autor}"></td>
                        <td th:text="*{genero}"></td>
                        <td>$ <span th:text="*{precio}"></span></td>
                        <td th:text="*{paginas}"></td>
                        <td>
                                    <span th:class="'disponible-' + *{disponible}"
                                          th:text="*{disponible} ? 'Disponible' : 'No disponible'">
                                    </span>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm" role="group">
                                <a th:href="@{/web/libros/ver/{id}(id=*{id})}"
                                   class="btn btn-info" title="Ver detalles">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/web/libros/editar/{id}(id=*{id})}"
                                   class="btn btn-warning" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/web/libros/eliminar/{id}(id=*{id})}"
                                   class="btn btn-danger"
                                   onclick="return confirm('¿Estás seguro de eliminar este libro?')"
                                   title="Eliminar">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${libros.empty}">
                        <td colspan="8" class="text-center text-muted">
                            No hay libros registrados. ¡Crea tu primer libro!
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
