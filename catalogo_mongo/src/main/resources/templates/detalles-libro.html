<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-info-circle"></i> Detalles del Libro
                    </h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong><i class="fas fa-hashtag"></i> ID:</strong> <span th:text="${libro.id}"></span></p>
                            <p><strong><i class="fas fa-heading"></i> Título:</strong> <span th:text="${libro.titulo}"></span></p>
                            <p><strong><i class="fas fa-user"></i> Autor:</strong> <span th:text="${libro.autor}"></span></p>
                            <p><strong><i class="fas fa-tag"></i> Género:</strong> <span th:text="${libro.genero}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong><i class="fas fa-dollar-sign"></i> Precio:</strong> $<span th:text="${libro.precio}"></span></p>
                            <p><strong><i class="fas fa-file-alt"></i> Páginas:</strong> <span th:text="${libro.paginas}"></span></p>
                            <p><strong><i class="fas fa-check-circle"></i> Disponibilidad:</strong>
                                <span th:class="${libro.disponible} ? 'text-success' : 'text-danger'"
                                      th:text="${libro.disponible} ? 'Disponible' : 'No disponible'">
                                    </span>
                            </p>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/web/libros}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Volver al Catálogo
                        </a>
                        <div>
                            <a th:href="@{/web/libros/editar/{id}(id=${libro.id})}" class="btn btn-warning">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <a th:href="@{/web/libros/eliminar/{id}(id=${libro.id})}"
                               class="btn btn-danger"
                               onclick="return confirm('¿Estás seguro de eliminar este libro?')">
                                <i class="fas fa-trash"></i> Eliminar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
