<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${libro.id} == null ? 'Crear Libro' : 'Editar Libro'">Formulario Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-book"></i>
                        <span th:text="${libro.id} == null ? 'Registrar Nuevo Libro' : 'Editar Libro'"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="${libro.id} == null ? @{/web/libros/guardar} : @{/web/libros/actualizar/{id}(id=${libro.id})}"
                          th:object="${libro}"
                          method="post">

                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título *</label>
                            <input type="text" class="form-control" id="titulo" th:field="*{titulo}" required>
                        </div>

                        <div class="mb-3">
                            <label for="autor" class="form-label">Autor *</label>
                            <input type="text" class="form-control" id="autor" th:field="*{autor}" required>
                        </div>

                        <div class="mb-3">
                            <label for="genero" class="form-label">Género *</label>
                            <select class="form-select" id="genero" th:field="*{genero}" required>
                                <option value="">Seleccione un género</option>
                                <option value="Ficción">Ficción</option>
                                <option value="No Ficción">No Ficción</option>
                                <option value="Ciencia Ficción">Ciencia Ficción</option>
                                <option value="Fantasía">Fantasía</option>
                                <option value="Misterio">Misterio</option>
                                <option value="Romance">Romance</option>
                                <option value="Biografía">Biografía</option>
                                <option value="Historia">Historia</option>
                                <option value="Tecnología">Tecnología</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label">Precio ($) *</label>
                                <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="paginas" class="form-label">Número de Páginas *</label>
                                <input type="number" class="form-control" id="paginas" th:field="*{paginas}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="disponible" th:field="*{disponible}">
                                <label class="form-check-label" for="disponible">Libro disponible</label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/web/libros}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar Libro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
